<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ذهب لايف</title>
  <meta name="theme-color" content="#0b0a08">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0a08; color: #f5efe0;
           font-family: -apple-system, BlinkMacSystemFont, "SF Arabic", Tahoma, sans-serif; text-align: center; }
    a { color: #f0d77b; }
  </style>
  <script>
    // GitHub Pages serves this for any unknown path. Send the visitor to the app
    // at the root of this repo's site (works for user.github.io/<repo>/...).
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var base = location.hostname.endsWith("github.io") && parts.length ? "/" + parts[0] + "/" : "/";
      location.replace(base);
    })();
  </script>
</head>
<body>
  <p>الصفحة غير موجودة — <a href="./">افتح ذهب لايف</a></p>
</body>
</html>
